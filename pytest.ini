[pytest]
testpaths = tests
pythonpath = src tests
addopts = -q --strict-markers
filterwarnings = error::RuntimeWarning
markers =
    slow: runs the real backtester over thousands of bars (minutes, not seconds).
        Excluded from the fast loop with `-m "not slow"`; CI runs them in full,
        because these are the tests that prove the instrument does not cheat.
