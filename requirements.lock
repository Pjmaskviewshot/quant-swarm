# requirements.lock
#
# WHAT THIS FILE IS: the exact versions the APEX test suite was executed
# against in the audit container. It is a record of what was verified, not a
# resolved production lock.
#
# WHAT IT IS NOT: identical to requirements.txt. Several packages resolved to
# NEWER versions here than the pins in requirements.txt request -- notably
# aiohttp, pandas and Flask. That is stated rather than hidden, because it means
# the suite has NOT been verified against the exact pinned set:
#
#     package    requirements.txt    actually tested here
#     aiohttp    ==3.9.5             3.14.3
#     pandas     ==2.2.2             3.0.2
#     flask      ==3.0.3             3.1.3
#
# ALSO NOT VERIFIED HERE: `supabase` is not installed in this container, so the
# cloud-ledger path ran only through its failure branches. The SQLite ledger is
# covered; the PostgREST write path is not.
#
# TO PRODUCE A REAL PRODUCTION LOCK, in a clean environment:
#     pip install -r requirements.txt && pip freeze > requirements.lock
# then re-run the suite against it before deploying.
#

